  <path d="M590 382 L520 412"/>
  <path d="M590 382 L660 412"/>
</g>

<!-- Internal nodes -->
<g fill="black" font-family="Libertinus Serif, serif" font-size="32" text-anchor="middle">
  <text x="503" y="42">Atayal</text>
  <text x="181" y="132">Northern Atayal</text>
  <text x="825" y="132">Southern Atayal</text>

